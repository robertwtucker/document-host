version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      # react-dom must match react exactly at runtime
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # eslint-config-next is kept in lockstep with next
      next:
        patterns:
          - next
          - eslint-config-next
      # typescript-eslint packages must share the same version
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    ignore:
      # @types/node tracks the Node 24 runtime
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
